version: '3.8'

services:
  postgres:
      image: postgres:16.14-alpine
      container_name: postgres_project
      environment:
        - POSTGRES_USER=postgres
        - POSTGRES_PASSWORD=12345
        - POSTGRES_DB=seguranca
      ports:
        - "5432:5432"
      volumes:
        - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: